# Tipografía: SF Mono para texto, Nerd Font Mono para glifos de iconos.
font_family SF Mono
font_size 11
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD JetBrainsMono Nerd Font Mono

# Apariencia glass (16 px = escala de espaciado del proyecto).
background_opacity 0.82
window_padding_width 16
hide_window_decorations yes
confirm_os_window_close 0

# Cursor y sesión.
cursor_shape beam
cursor_blink_interval 0.5
enable_audio_bell no
scrollback_lines 10000

# Barra de pestañas inferior, solo visible con 2+ pestañas.
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
active_tab_font_style bold
inactive_tab_font_style normal
tab_title_template "{index}: {title} · {num_windows}"

# Paleta activa (tema claro/oscuro). Siempre al final para que mande.
include /home/shadow/.config/theme/current.kitty
