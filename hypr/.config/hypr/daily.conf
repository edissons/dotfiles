# --- Entorno ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# --- Servicios de sesión ---
exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator
exec-once = blueman-applet

# --- Volumen, brillo y multimedia ---
binde = , XF86AudioRaiseVolume, exec, pamixer -i 5
binde = , XF86AudioLowerVolume, exec, pamixer -d 5
bind  = , XF86AudioMute, exec, pamixer -t
bind  = , XF86AudioMicMute, exec, pamixer --default-source -t
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind  = , XF86AudioPlay, exec, playerctl play-pause
bind  = , XF86AudioNext, exec, playerctl next
bind  = , XF86AudioPrev, exec, playerctl previous

# --- Capturas ---
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png

# --- Apps y portapapeles ---
bind = $mod, E, exec, dolphin
bind = $mod, B, exec, Brave
bind = $mod SHIFT, V, exec, cliphist list | rofi -dmenu -p Portapapeles -config $HOME/dotfiles/rofi/.config/rofi/config.rasi | cliphist decode | wl-copy

# --- Ventanas ---
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
binde = $mod CTRL, left, resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up, resizeactive, 0 -40
binde = $mod CTRL, down, resizeactive, 0 40
bind = $mod, J, layoutmsg, togglesplit
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
