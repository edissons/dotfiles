source = ~/.config/theme/current.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = @WALL@
    blur_passes = 0
    brightness = $lock_bg_brightness
}

# --- Fecha ---
label {
    monitor =
    text = cmd[update:60000] /home/shadow/.local/bin/lock-info date
    color = $text
    font_size = 26
    font_family = $font_display
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    position = 0, -70
    halign = center
    valign = top
}

# --- Hora ---
label {
    monitor =
    text = <span font_weight="600">$TIME</span>
    color = $text
    font_size = 80
    font_family = $font_display
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow
    position = 0, -108
    halign = center
    valign = top
}

# --- Estado (teclado, batería, wifi) ---
label {
    monitor =
    text = @STATUS@
    color = $text
    font_size = 10
    font_family = $font_icons
    shadow_passes = 2
    shadow_size = 2
    shadow_color = $shadow
    position = -28, -22
    halign = right
    valign = top
}

# --- Avatar: círculo con la inicial ---
shape {
    monitor =
    size = 68, 68
    color = $bg
    rounding = -1
    border_size = 1
    border_color = $border_active
    position = 0, 150
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] /home/shadow/.local/bin/lock-info initial
    color = $text
    font_size = 30
    font_family = $font_display
    position = 0, 166
    halign = center
    valign = bottom
}

# --- Nombre ---
label {
    monitor =
    text = cmd[update:60000] /home/shadow/.local/bin/lock-info name
    color = $text
    font_size = 14
    font_family = $font_ui
    shadow_passes = 2
    shadow_size = 2
    shadow_color = $shadow
    position = 0, 116
    halign = center
    valign = bottom
}

# --- Mensaje de ayuda ---
label {
    monitor =
    text = Escribe tu contraseña
    color = $subtext
    font_size = 11
    font_family = $font_ui
    shadow_passes = 2
    shadow_size = 2
    shadow_color = $shadow
    position = 0, 94
    halign = center
    valign = bottom
}

# --- Campo de contraseña: aparece al escribir ---
input-field {
    monitor =
    size = 260, 40
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $border_active
    inner_color = $bg
    font_color = $text
    font_family = $font_ui
    check_color = $accent
    fail_color = $red
    fade_on_empty = true
    placeholder_text =
    rounding = -1
    fail_text = <i>$FAIL</i>
    position = 0, 40
    halign = center
    valign = bottom
}
