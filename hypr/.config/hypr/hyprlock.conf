source = ~/.config/theme/current.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.02
    brightness = 0.75
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = Inter Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = $subtext
    font_size = 20
    font_family = Inter
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $border_active
    inner_color = $bg
    font_color = $text
    check_color = $accent
    fail_color = rgba(ff453aff)
    fade_on_empty = true
    rounding = 26
    placeholder_text = <span foreground="##a1a1a6">Contraseña</span>
    fail_text = <i>$FAIL</i>
    position = 0, -40
    halign = center
    valign = center
}
