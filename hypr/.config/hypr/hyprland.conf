# --- Colores del tema (claro/oscuro) ---
source = ~/.config/theme/current.conf

# --- Monitor ---
monitor = eDP-1, preferred, auto, 1

# --- Variables ---
$terminal = kitty
$mod = SUPER

env = XCURSOR_THEME,WhiteSur-cursors
env = XCURSOR_SIZE,24
env = KITTY_CONFIG_DIRECTORY,/home/shadow/dotfiles/kitty/.config/kitty

xwayland {
    force_zero_scaling = true
}

# --- Entrada (cambia kb_layout a tu distribución: us, latam, es...) ---
input {
    kb_layout = latam
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# --- Aspecto ---
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = $border_active
    col.inactive_border = $border_inactive
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity = 0.92
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 5
        passes = 2
        noise = 0.02
        vibrancy = 0.3
        popups = true
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000040)
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 5, ease, popin 90%
    animation = fade, 1, 5, ease
    animation = workspaces, 1, 6, ease, slide
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# --- Blur en barra, launcher y notificaciones ---
layerrule {
    name = glass
    match:namespace = ^(waybar|rofi|swaync-control-center|swaync-notification-window)$
    blur = true
    blur_popups = true
    ignore_alpha = 0.3
}

# --- Atajos básicos ---
bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod SHIFT, E, exit
bind = $mod, T, exec, theme-toggle

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = $mod, Space, exec, rofi -show drun -config $HOME/dotfiles/rofi/.config/rofi/config.rasi
bind = $mod SHIFT, B, exec, $HOME/.local/bin/waybar-restart


exec-once = hyprctl setcursor WhiteSur-cursors 24
exec-once = $HOME/.local/bin/wallpaper-select restore
exec-once = $HOME/.local/bin/waybar-restart

bind = $mod SHIFT, W, exec, $HOME/.local/bin/wallpaper-select
bind = $mod, F1, exec, $HOME/.local/bin/keybinds-viewer
bind = $mod SHIFT, P, exec, $HOME/.local/bin/power-menu
