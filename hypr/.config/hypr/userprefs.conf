# Set your personal hyprland configuration here
# See https://wiki.hypr.land/Configuring for more information

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hypr.land/Configuring/Variables/#input
input {
    # kb_layout = us
    # follow_mouse = 1
    # sensitivity = 0
    # force_no_accel = 0
    # accel_profile = flat
    # numlock_by_default = true

    # 🔗 See https://wiki.hypr.land/Configuring/Variables/#touchpad
    touchpad {
        natural_scroll = no
    }

}



# 🔗 See https://wiki .hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# for window shallow similar to devour
misc {
    # enable_swallow = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}

xwayland {
    force_zero_scaling = true
}

# ── Input personalizado ──────────────────────────────────────
input {
    kb_layout = latam
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ── Keybinds personales ──────────────────────────────────────
# Terminal con Super + Return
bind = $mainMod, Return, exec, $TERMINAL

# Firefox
bind = $mainMod, F, exec, firefox

# Menú de apps
bind = $mainMod, space, exec, ~/.local/bin/rofi-drun

# Ciclar escritorios
bind = $mainMod Control, Right, workspace, e+1
bind = $mainMod Control, Left,  workspace, e-1

# Gaming — desactivar/activar bloqueo de pantalla
bind = $mainMod, F1,       exec, pkill hypridle && notify-send "Idle desactivado"
bind = $mainMod Shift, F1, exec, hypridle & notify-send "Idle activado"

# Servidor HTTP rápido para transferir archivos en HTB
bind = $mainMod Alt, H, exec, kitty --title "HTTP Server" bash -c "cd ~ && python3 -m http.server 8000"


exec-once = ~/.local/bin/sync-nx-mods.sh
exec-once = ~/.local/bin/sync-totk-mod.sh
exec-once = bash -c 'sleep 3 && exec ~/.local/bin/gamepad-overlay'

# >>> language-input >>>
# Managed by Settings -> Language & Input (Glasshouse).
# This block is replaced on every change; do not edit it by hand.
# Current Hyprland state: kb_layout=latam, kb_options empty.
# Change these from the Settings menu or keep them in sync with hyprctl.
input {
    kb_layout = latam
    kb_options =
}
