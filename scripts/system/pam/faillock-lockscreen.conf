# Glasshouse: instancia propia de faillock para SDDM e hyprlock.
#
# El retardo progresivo lo aplica glasshouse-pam-cooldown leyendo este tally;
# deny=15 es solo una red de seguridad (con los retardos es difícil llegar).
# fail_interval debe coincidir con FAIL_INTERVAL de glasshouse-pam-cooldown.

deny = 15
fail_interval = 900
unlock_time = 600
